    <div class="sidebarBottom"><div class="miniGuide"><strong>UI Prototype · PA2</strong><p>3 Use Case được mô phỏng đầy đủ. Không sử dụng backend hoặc tài khoản thật.</p><button class="btn btn-soft btn-sm" type="button" data-action="guide">Hướng dẫn demo</button></div></div>

<script>
(()=>{'use strict';
const STORAGE='trozy_team11_pa2_local_v1', money=new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0});
const seed=()=>({rooms:[{id:'r101',code:'101',floor:'Tầng 1',area:24,capacity:2,price:3200000,status:'occupied',amenities:'Máy lạnh, tủ lạnh'},{id:'r102',code:'102',floor:'Tầng 1',area:20,capacity:2,price:3000000,status:'vacant',amenities:'Máy lạnh'},{id:'r201',code:'201',floor:'Tầng 2',area:28,capacity:3,price:3800000,status:'occupied',amenities:'Máy lạnh, máy giặt'},{id:'r202',code:'202',floor:'Tầng 2',area:22,capacity:2,price:3100000,status:'vacant',amenities:'Giường, tủ quần áo'},{id:'r203',code:'203',floor:'Tầng 2',area:25,capacity:2,price:3350000,status:'maintenance',amenities:'Máy lạnh'}],tenants:[{id:'t1',name:'Nguyễn Văn A',phone:'0901234567',roomId:'r101',contractEnd:'2027-04-30'},{id:'t2',name:'Trần Thị B',phone:'0988765432',roomId:'r201',contractEnd:'2027-03-31'}],invoices:[{id:'HD-0926-101',roomId:'r101',tenantId:'t1',month:'2026-09',elecOld:940,elecNew:1010,waterOld:128,waterNew:132,elecRate:3500,waterRate:16000,service:100000,adjustment:0,note:'',rent:3200000,total:3609000,paid:3609000,createdAt:'2026-09-30T10:00:00.000Z'},{id:'HD-1026-201',roomId:'r201',tenantId:'t2',month:'2026-10',elecOld:2200,elecNew:2280,waterOld:340,waterNew:346,elecRate:3500,waterRate:16000,service:120000,adjustment:0,note:'',rent:3800000,total:4296000,paid:0,createdAt:'2026-10-10T10:00:00.000Z'}],readings:[{id:'rd0',roomId:'r101',month:'2026-09',elecOld:940,elecNew:1010,waterOld:128,waterNew:132,source:'manual'}],issues:[{id:'YC-1001',roomId:'r201',tenantId:'t2',category:'Thiết bị điện',priority:'normal',description:'Đèn trần trong phòng không sáng khi bật công tắc.',status:'progress',createdAt:'2026-10-20T10:00:00.000Z',image:'',landlordNote:'Đã tiếp nhận và hẹn lịch kiểm tra.'}],configuration:{elecRate:3500,waterRate:16000}});
let data=loadData(), role='landlord', page='dashboard', roomQuery='', roomFilter='all', invoiceFilter='all', issueFilter='all', preview=null, toastTimeout, modalSubmit=null;
const $=s=>document.querySelector(s), el=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cash=n=>money.format(Number(n)||0), ni=v=>Number.isFinite(Number(v))?Number(v):0, isoMonth=()=>new Date().toISOString().slice(0,7), fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('vi-VN'):'—';
function loadData(){try{const raw=JSON.parse(localStorage.getItem(STORAGE));if(raw&&Array.isArray(raw.rooms)&&Array.isArray(raw.tenants)&&Array.isArray(raw.invoices)&&Array.isArray(raw.issues)&&Array.isArray(raw.readings))return raw;}catch(e){}return seed()}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data));return true}catch(e){toast('Không đủ dung lượng lưu trên trình duyệt. Hãy thử ảnh nhỏ hơn hoặc đặt lại demo.',true);return false}}
function toast(msg,bad=false){const x=$('#toast');x.textContent=msg;x.className='toast show'+(bad?' bad':'');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>x.className='toast',3500)}
const room=id=>data.rooms.find(x=>x.id===id), tenantForRoom=id=>data.tenants.find(t=>t.roomId===id), myTenant=()=>data.tenants.find(t=>t.id==='t1'), ownRoomId=()=>myTenant()?.roomId, invState=x=>x.paid>=x.total?'paid':x.paid>0?'partial':'unpaid';
const roomState=s=>({vacant:['Phòng trống','red'],occupied:['Đang thuê','green'],maintenance:['Bảo trì','yellow']}[s]||['Chưa xác định','grey']);
const statusInvoice=s=>({paid:['Đã thu đủ','green'],partial:['Đã thu một phần','yellow'],unpaid:['Chưa thu','red']}[s]);
const statusIssue=s=>({new:['Chờ tiếp nhận','yellow'],progress:['Đang xử lý','indigo'],resolved:['Đã sửa – chờ xác nhận','green'],closed:['Đã hoàn tất','grey']}[s]);
const badge=(label,color='grey')=>`<span class="pill ${color}">${esc(label)}</span>`;
const pillRoom=x=>{const [name,c]=roomState(x.status);return badge(name,c)};
const pillInv=x=>{const [name,c]=statusInvoice(invState(x));return badge(name,c)};
const pillIssue=x=>{const [name,c]=statusIssue(x.status);return badge(name,c)};
const header=(k,t,desc,action='')=>`<div class="pageHeader"><div><div class="eyebrow">${esc(k)}</div><h1>${esc(t)}</h1><p class="sub">${esc(desc)}</p></div>${action?`<div class="buttonRow">${action}</div>`:''}</div>`;
const stat=(symbol,label,value,sub)=>`<div class="stat"><span class="statIcon">${esc(symbol)}</span><small>${esc(label)}</small><div class="statValue">${esc(value)}</div><div class="statDetail">${esc(sub)}</div></div>`;
const empty=msg=>`<div class="empty"><strong>Chưa có dữ liệu</strong>${esc(msg)}</div>`;
const note=(title,message,warning=false)=>`<div class="notice${warning?' warn':''}"><span style="font-weight:900;font-size:15px">i</span><div><strong>${esc(title)}</strong>${esc(message)}</div></div>`;

function tenantPage(){return header('M04 · Danh sách liên kết','Khách thuê','Danh sách để đối chiếu phòng, hợp đồng và dữ liệu demo.')+note('Giới hạn prototype','Thông tin người thuê đang là dữ liệu mẫu, không bao gồm thao tác quản lý CCCD hay hợp đồng điện tử.')+`<section class="card"><div class="tableWrap"><table><thead><tr><th>Người thuê</th><th>Phòng</th><th>Điện thoại (đã che)</th><th>Hợp đồng đến</th><th>Trạng thái</th></tr></thead><tbody>${data.tenants.map(t=>`<tr><td><strong>${esc(t.name)}</strong></td><td>${esc(room(t.roomId)?.code||'—')}</td><td>${esc(t.phone.slice(0,3)+'****'+t.phone.slice(-3))}</td><td>${fmtDate(t.contractEnd)}</td><td>${badge('Đang thuê','green')}</td></tr>`).join('')}</tbody></table></div></section>`}

v class="summaryLine"><span>Hợp đồng đến</span><strong>${fmtDate(t.contractEnd)}</strong></div></div></div></section></div>`}
function tenantInvoices(){const t=myTenant(),invoices=[...data.invoices].filter(x=>x.tenantId===t.id).reverse();return header('M08 / M09 · Xem và theo dõi','Hóa đơn của tôi','Người thuê xem được hóa đơn và trạng thái, không thể xác nhận tiền đã thu.')+`<section class="card"><div class="tableWrap"><table><thead><tr><th>Mã hóa đơn</th><th>Kỳ</th><th>Tổng</th><th>Đã thu</th><th>Trạng thái</th><th></th></tr></thead><tbody>${invoices.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.month)}</td><td>${cash(x.total)}</td><td>${cash(x.paid)}</td><td>${pillInv(x)}</td><td><button class="btn btn-outline btn-sm" data-action="invoice-detail" data-id="${esc(x.id)}">Xem chi tiết</button></td></tr>`).join('')}</tbody></table></div></section>`}

function openModal(title,body,buttonLabel='',handler=null){modalSubmit=handler;const modal=$('#modal');modal.innerHTML=`<div class="modalHeader"><h2 id="modalTitle">${esc(title)}</h2><button class="xButton" type="button" aria-label="Đóng" data-action="close-modal">×</button></div><form id="modalForm" novalidate><div class="modalBody">${body}<div id="modalError" class="formError" role="alert"></div></div><div class="modalFoot"><button type="button" class="btn btn-outline" data-action="close-modal">Đóng</button>${buttonLabel?`<button type="submit" class="btn btn-primary">${esc(buttonLabel)}</button>`:''}</div></form>`;modal.showModal()}
function closeModal(){const m=$('#modal');if(m.open)m.close();modalSubmit=null}
function errorIn(form,msg){const holder=form.querySelector('.formError');if(holder){holder.textContent=msg;holder.classList.add('show')}toast(msg,true)}
function roomModal(id=null){const r=id?room(id):null;if(id&&!r)return;const allowed=r?.status==='occupied'?`<input readonly name="currentStatus" value="Đang thuê – chỉ thay đổi qua quy trình trả phòng">`:`<select name="status"><option value="vacant" ${r?.status==='vacant'?'selected':''}>Phòng trống</option><option value="maintenance" ${r?.status==='maintenance'?'selected':''}>Bảo trì</option></select>`;openModal(r?'Chỉnh sửa Phòng '+r.code:'Thêm phòng mới',`<div class="formGrid"><div class="field"><label>Mã phòng <span class="required">*</span></label><input name="code" required maxlength="10" placeholder="Ví dụ: 301" value="${esc(r?.code||'')}"></div><div class="field"><label>Tầng / khu vực <span class="required">*</span></label><input name="floor" required maxlength="45" placeholder="Ví dụ: Tầng 3" value="${esc(r?.floor||'Tầng 1')}"></div><div class="field"><label>Diện tích (m²) <span class="required">*</span></label><input type="number" name="area" required min="1" max="200" step="0.5" value="${esc(r?.area||20)}"></div><div class="field"><label>Sức chứa (người) <span class="required">*</span></label><input type="number" name="capacity" required min="1" max="20" step="1" value="${esc(r?.capacity||2)}"></div><div class="field"><label>Giá thuê (VNĐ/tháng) <span class="required">*</span></label><input type="number" name="price" required min="1000" step="1000" value="${esc(r?.price||3000000)}"></div><div class="field"><label>Trạng thái</label>${allowed}</div><div class="field full"><label>Tiện nghi</label><textarea name="amenities" maxlength="300" placeholder="Máy lạnh, tủ lạnh...">${esc(r?.amenities||'')}</textarea></div></div>${r?.status==='occupied'?`<div class="alertInfo">Phòng có người thuê không được đánh dấu Trống hoặc Bảo trì chỉ qua thao tác này.</div>`:''}`,r?'Lưu thay đổi':'Tạo phòng',(f)=>{const vals=Object.fromEntries(new FormData(f).entries());const code=vals.code.trim(),floor=vals.floor.trim(),area=Number(vals.area),capacity=Number(vals.capacity),price=Number(vals.price);if(!/^[\p{L}0-9_-]{2,10}$/u.test(code))return errorIn(f,'Mã phòng phải dài 2–10 ký tự, không chứa khoảng trắng.');if(data.rooms.some(x=>x.id!==r?.id&&x.code.toLowerCase()===code.toLowerCase()))return errorIn(f,'Mã phòng đã tồn tại. Hãy chọn mã khác.');if(!floor)return errorIn(f,'Cần nhập tầng/khu vực.');if(!Number.isFinite(area)||area<1||area>200||!Number.isInteger(capacity)||capacity<1||capacity>20||!Number.isInteger(price)||price<1000)return errorIn(f,'Diện tích, sức chứa hoặc giá thuê chưa hợp lệ.');const next={id:r?.id||('r'+Date.now()),code,floor,area,capacity,price,status:r?.status==='occupied'?'occupied':vals.status,amenities:vals.amenities.trim()};const old=JSON.stringify(data.rooms);if(r){Object.assign(r,next)}else data.rooms.push(next);if(!save()){data.rooms=JSON.parse(old);return}closeModal();render();toast(r?'Đã cập nhật Phòng '+code:'Đã tạo Phòng '+code)})}
function roomDetail(id){const r=room(id);if(!r)return;const t=tenantForRoom(id);openModal('Chi tiết Phòng '+r.code,`<div class="infoRows"><span>Mã phòng</span><strong>${esc(r.code)}</strong></div><div class="infoRows"><span>Vị trí</span><strong>${esc(r.floor)}</strong></div><div class="infoRows"><span>Diện tích</span><strong>${ni(r.area)} m²</strong></div><div class="infoRows"><span>Sức chứa</span><strong>${ni(r.capacity)} người</strong></div><div class="infoRows"><span>Giá thuê</span><strong>${cash(r.price)} / tháng</strong></div><div class="infoRows"><span>Trạng thái</span><strong>${pillRoom(r)}</strong></div><div class="infoRows"><span>Người thuê</span><strong>${esc(t?.name||'Chưa có')}</strong></div><div class="infoRows"><span>Tiện nghi</span><strong>${esc(r.amenities||'Không ghi nhận')}</strong></div><p class="helper">Liên kết người thuê/hợp đồng và chuyển trạng thái khi trả phòng nằm ngoài 3 Use Case trọng tâm của prototype này.</p>`)}
function latestReading(roomId,month){const all=[...data.readings.map(x=>({roomId:x.roomId,month:x.month,elecNew:x.elecNew,waterNew:x.waterNew})),...data.invoices.map(x=>({roomId:x.roomId,month:x.month,elecNew:x.elecNew,waterNew:x.waterNew}))].filter(x=>x.roomId===roomId&&x.month<month).sort((a,b)=>a.month.localeCompare(b.month));return all.at(-1)||null}
function prefillBill(){const f=$('#invoiceForm');if(!f)return;const roomId=f.elements.roomId.value,month=f.elements.month.value;const saved=data.readings.find(x=>x.roomId===roomId&&x.month===month),old=latestReading(roomId,month);const eo=saved?.elecOld??old?.elecNew??0,wo=saved?.waterOld??old?.waterNew??0;f.elements.elecOld.value=eo;f.elements.elecNew.value=saved?.elecNew??eo+100;f.elements.waterOld.value=wo;f.elements.waterNew.value=saved?.waterNew??wo+6;updatePreview(false)}
function billValues(f){const v=Object.fromEntries(new FormData(f).entries()),r=room(v.roomId);if(!r||r.status!=='occupied')return {error:'Chỉ lập hóa đơn cho phòng đang có người thuê.'};const t=tenantForRoom(r.id);if(!t)return {error:'Phòng chưa được liên kết với người thuê.'};if(!/^\d{4}-\d{2}$/.test(v.month))return {error:'Vui lòng chọn kỳ hóa đơn hợp lệ.'};if(data.invoices.some(x=>x.roomId===r.id&&x.month===v.month))return {error:`Phòng ${r.code} đã có hóa đơn kỳ ${v.month}. Không được tạo trùng.`};const fields=['elecOld','elecNew','waterOld','waterNew','elecRate','waterRate','service','adjustment'];for(const k of fields){if(v[k]===''||!Number.isFinite(Number(v[k]))||!Number.isInteger(Number(v[k])))return {error:'Hãy nhập các chỉ số và đơn giá bằng số nguyên hợp lệ.'}};const val=Object.fromEntries(fields.map(k=>[k,Number(v[k])]));if(['elecOld','elecNew','waterOld','waterNew','elecRate','waterRate','service'].some(k=>val[k]<0))return {error:'Chỉ số, đơn giá và phí dịch vụ không được âm.'};if(val.elecNew<val.elecOld||val.waterNew<val.waterOld)return {error:'Chỉ số mới không được nhỏ hơn chỉ số cũ.'};const electric=(val.elecNew-val.elecOld)*val.elecRate,water=(val.waterNew-val.waterOld)*val.waterRate,total=r.price+electric+water+val.service+val.adjustment;if(total<0)return {error:'Tổng hóa đơn không được âm. Hãy kiểm tra khoản điều chỉnh.'};return {bill:{roomId:r.id,tenantId:t.id,month:v.month, ...val,rent:r.price,note:v.note?.trim()||'',electric,water,total}}}
function billSummary(b){return `<div class="summaryLine"><span>Phòng / Kỳ</span><strong>${esc(room(b.roomId)?.code)} / ${esc(b.month)}</strong></div><div class="summaryLine"><span>Người thuê</span><strong>${esc(data.tenants.find(t=>t.id===b.tenantId)?.name)}</strong></div><div class="summaryLine"><span>Tiền phòng</span><strong>${cash(b.rent)}</strong></div><div class="summaryLine"><span>Điện: ${b.elecNew-b.elecOld} kWh × ${cash(b.elecRate)}</span><strong>${cash(b.electric??(b.elecNew-b.elecOld)*b.elecRate)}</strong></div><div class="summaryLine"><span>Nước: ${b.waterNew-b.waterOld} m³ × ${cash(b.waterRate)}</span><strong>${cash(b.water??(b.waterNew-b.waterOld)*b.waterRate)}</strong></div><div class="summaryLine"><span>Phí dịch vụ</span><strong>${cash(b.service)}</strong></div><div class="summaryLine"><span>Điều chỉnh</span><strong>${cash(b.adjustment)}</strong></div><div class="summaryLine total"><span>Tổng thanh toán</span><strong>${cash(b.total)}</strong></div>${b.note?`<p class="helper">Ghi chú: ${esc(b.note)}</p>`:''}`}
function updatePreview(showError){const f=$('#invoiceForm'),p=$('#invoicePreview');if(!f||!p)return;const r=billValues(f);const err=$('#invoiceError');err.classList.remove('show');if(r.error){p.innerHTML=`<div class="alertInfo">${esc(r.error)}</div>`;if(showError)errorIn(f,r.error);return}p.innerHTML=`<div class="summaryBox">${billSummary(r.bill)}</div><p class="helper">Đã tính từ dữ liệu hiện có. Kiểm tra kỹ trước khi phát hành.</p>`;return r.bill}
function publishInvoice(f){const res=billValues(f);if(res.error)return errorIn(f,res.error);const b=res.bill;updatePreview(false);if(!confirm(`Phát hành hóa đơn cho Phòng ${room(b.roomId).code}, kỳ ${b.month}, tổng ${cash(b.total)}?`))return;const id=`HD-${b.month.slice(5)}${b.month.slice(2,4)}-${room(b.roomId).code}`,record={id,...b,paid:0,createdAt:new Date().toISOString()};const before=data.invoices.length;data.invoices.push(record);if(!save()){data.invoices.length=before;return}invoiceFilter='all';toast('Phát hành thành công hóa đơn '+id);navigate('invoices')}
function invoiceDetail(id){const x=data.invoices.find(x=>x.id===id);if(!x)return;if(role==='tenant'&&x.tenantId!==myTenant().id)return toast('Bạn không có quyền xem hóa đơn này.',true);const outstanding=Math.max(0,x.total-x.paid);openModal('Chi tiết hóa đơn '+id,`<div class="summaryBox">${billSummary(x)}<div class="summaryLine"><span>Đã được chủ trọ xác nhận thu</span><strong>${cash(x.paid)}</strong></div><div class="summaryLine"><span>Còn phải thu</span><strong>${cash(outstanding)}</strong></div></div><div style="margin-top:13px">${pillInv(x)}</div><div class="alertInfo">${role==='tenant'?'Bạn chỉ xem thông tin thanh toán. Nếu đã chuyển khoản, hãy chờ chủ trọ đối chiếu và xác nhận.':'Xác nhận thu tiền chỉ thực hiện sau khi kiểm tra thực tế khoản nhận được.'} Demo không kết nối ngân hàng hoặc tạo QR thanh toán thật.</div>`)}
function paymentModal(id){if(role!=='landlord')return;const x=data.invoices.find(x=>x.id===id);if(!x)return;const due=Math.max(0,x.total-x.paid);if(!due)return toast('Hóa đơn đã thanh toán đủ.');openModal('Xác nhận đã nhận tiền',`<p class="sub" style="margin-bottom:16px">${esc(x.id)} · Phòng ${esc(room(x.roomId)?.code)} · Còn phải thu: <strong>${cash(due)}</strong></p><div class="field"><label>Số tiền thực nhận (VNĐ) <span class="required">*</span></label><input type="number" name="amount" min="1" max="${due}" step="1" value="${due}" required></div><div class="alertInfo">Chỉ xác nhận sau khi bạn đã kiểm tra tiền mặt hoặc giao dịch chuyển khoản thực tế. Có thể ghi nhận thanh toán một phần.</div>`, 'Ghi nhận đã thu',f=>{const amount=Number(f.elements.amount.value);if(!Number.isInteger(amount)||amount<1||amount>due)return errorIn(f,'Số tiền phải lớn hơn 0 và không vượt quá công nợ.');const before=x.paid;x.paid+=amount;if(!save()){x.paid=before;return}closeModal();render();toast('Đã ghi nhận '+cash(amount)+' cho hóa đơn '+x.id)})}
function meterModal(){const eligible=data.rooms.filter(r=>r.status==='occupied');openModal('Nhập chỉ số điện nước',`<div class="formGrid"><div class="field"><label>Phòng</label><select name="roomId">${eligible.map(r=>`<option value="${r.id}">Phòng ${esc(r.code)}</option>`).join('')}</select></div><div class="field"><label>Kỳ</label><input type="month" name="month" value="2026-11" required></div><div class="field"><label>Điện cũ</label><input name="elecOld" type="number" min="0" step="1" value="1110"></div><div class="field"><label>Điện mới</label><input name="elecNew" type="number" min="0" step="1" value="1200"></div><div class="field"><label>Nước cũ</label><input name="waterOld" type="number" min="0" step="1" value="138"></div><div class="field"><label>Nước mới</label><input name="waterNew" type="number" min="0" step="1" value="144"></div></div><div class="alertInfo">Bạn có thể nhập thủ công hoặc bấm nút mô phỏng dưới đây. Bản demo không chạy OCR thực tế.</div><button style="margin-top:12px" class="btn btn-outline" data-action="simulate-ocr" type="button">Mô phỏng gợi ý OCR</button>`, 'Xác nhận & lưu chỉ số',f=>{const v=Object.fromEntries(new FormData(f).entries());for(const k of ['elecOld','elecNew','waterOld','waterNew'])if(v[k]===''||!Number.isInteger(Number(v[k]))||Number(v[k])<0)return errorIn(f,'Chỉ số phải là số nguyên không âm.');if(!/^\d{4}-\d{2}$/.test(v.month)||Number(v.elecNew)<Number(v.elecOld)||Number(v.waterNew)<Number(v.waterOld))return errorIn(f,'Kỳ hoặc chỉ số cũ/mới chưa hợp lệ.');if(data.readings.some(x=>x.roomId===v.roomId&&x.month===v.month))return errorIn(f,'Đã có chỉ số cho phòng và kỳ này.');const rec={id:'rd'+Date.now(),roomId:v.roomId,month:v.month,elecOld:Number(v.elecOld),elecNew:Number(v.elecNew),waterOld:Number(v.waterOld),waterNew:Number(v.waterNew),source:f.dataset.source||'manual'};data.readings.push(rec);if(!save()){data.readings.pop();return}closeModal();render();toast('Đã lưu chỉ số (dữ liệu demo)')})}
function requestModal(){if(role!=='tenant')return;openModal('Gửi yêu cầu sửa chữa',`<div class="formGrid"><div class="field"><label>Phòng</label><input readonly value="Phòng ${esc(room(ownRoomId())?.code||'')}" aria-label="Phòng hiện tại"></div><div class="field"><label>Loại sự cố <span class="required">*</span></label><select name="category"><option>Điện nước</option><option>Thiết bị điện</option><option>Nội thất</option><option>Khác</option></select></div><div class="field full"><label>Mức độ do người thuê đánh giá</label><select name="priority"><option value="normal">Bình thường</option><option value="low">Thấp</option><option value="urgent">Khẩn cấp</option></select></div><div class="field full"><label>Mô tả sự cố <span class="required">*</span></label><textarea name="description" minlength="10" maxlength="800" required placeholder="Mô tả tình trạng, vị trí và thời điểm phát hiện..." rows="4"></textarea><span class="hint">Tối thiểu 10 ký tự.</span></div><div class="field full"><label>Ảnh minh chứng (không bắt buộc)</label><input name="photo" type="file" accept="image/png,image/jpeg,image/webp"><span class="hint">PNG, JPEG hoặc WebP, tối đa 600 KB để lưu trên trình duyệt demo.</span></div></div>`, 'Gửi yêu cầu',async f=>{if(f.dataset.sending==='true')return;const desc=f.elements.description.value.trim(),category=f.elements.category.value,priority=f.elements.priority.value,file=f.elements.photo.files[0];if(desc.length<10)return errorIn(f,'Mô tả sự cố cần ít nhất 10 ký tự.');if(file&&(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>600*1024))return errorIn(f,'Chọn ảnh PNG/JPEG/WebP không vượt quá 600 KB.');f.dataset.sending='true';let image='';if(file){try{image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Không đọc được ảnh'));reader.readAsDataURL(file)})}catch(e){f.dataset.sending='false';return errorIn(f,'Không đọc được ảnh, hãy thử file khác.')}}const prev=data.issues.length;const rec={id:'YC-'+String(Date.now()).slice(-7),roomId:ownRoomId(),tenantId:myTenant().id,category,priority,description:desc,status:'new',createdAt:new Date().toISOString(),image,landlordNote:''};data.issues.push(rec);if(!save()){data.issues.length=prev;f.dataset.sending='false';return}closeModal();render();toast('Đã gửi yêu cầu '+rec.id+' đến Chủ trọ')})}
function issueDetail(id){const x=data.issues.find(x=>x.id===id);if(!x)return;if(role==='tenant'&&x.tenantId!==myTenant().id)return toast('Bạn không được xem yêu cầu này.',true);openModal('Yêu cầu sửa chữa '+id,`<div class="infoRows"><span>Phòng</span><strong>${esc(room(x.roomId)?.code)}</strong></div><div class="infoRows"><span>Người gửi</span><strong>${esc(data.tenants.find(t=>t.id===x.tenantId)?.name)}</strong></div><div class="infoRows"><span>Loại sự cố</span><strong>${esc(x.category)}</strong></div><div class="infoRows"><span>Mức độ</span><strong>${esc(x.priority==='urgent'?'Khẩn cấp':x.priority==='low'?'Thấp':'Bình thường')}</strong></div><div class="infoRows"><span>Trạng thái</span><strong>${pillIssue(x)}</strong></div><div class="infoRows"><span>Ngày tạo</span><strong>${new Date(x.createdAt).toLocaleString('vi-VN')}</strong></div><div class="infoRows"><span>Mô tả</span><strong>${esc(x.description)}</strong></div>${x.image?`<p class="helper">Ảnh minh chứng:</p><img class="fileLink" alt="Ảnh người thuê đính kèm" src="${esc(x.image)}">`:''}${x.landlordNote?`<div class="alertInfo">Ghi chú của chủ trọ: ${esc(x.landlordNote)}</div>`:''}`)}
function advanceIssue(id,action){const x=data.issues.find(x=>x.id===id);if(!x)return;let newStatus;if(action==='issue-progress'&&role==='landlord'&&x.status==='new')newStatus='progress';else if(action==='issue-resolve'&&role==='landlord'&&x.status==='progress')newStatus='resolved';else if(action==='issue-close'&&role==='tenant'&&x.tenantId===myTenant().id&&x.status==='resolved')newStatus='closed';else return toast('Thao tác không hợp lệ với trạng thái hiện tại.',true);const old=x.status,note=x.landlordNote;x.status=newStatus;if(newStatus==='progress')x.landlordNote='Chủ trọ đã tiếp nhận. Đang sắp xếp xử lý.';if(newStatus==='resolved')x.landlordNote='Chủ trọ thông báo đã sửa xong, chờ người thuê xác nhận.';if(!save()){x.status=old;x.landlordNote=note;return}render();toast('Đã cập nhật: '+statusIssue(newStatus)[0])}
function guideModal(){openModal('Hướng dẫn trình bày UI PA2',`<p class="sub" style="margin-bottom:17px">Đây là prototype HTML/CSS/JavaScript phát triển từ màu sắc, sidebar và 6 màn hình PA1. Không cần backend; dữ liệu được lưu trong trình duyệt.</p><div class="guideSteps"><div class="guideStep"><div><strong>UC01 · Manage Rental Rooms (M03)</strong><span>Vai trò Chủ trọ → Quản lý phòng → Thêm phòng → kiểm tra thông tin → lưu → xem/sửa phòng. Thử mã trùng để xem Alternative Flow.</span></div></div><div class="guideStep"><div><strong>UC02 · Generate Monthly Invoice (M06–M08)</strong><span>Chủ trọ → Hóa đơn & thu tiền → Tạo hóa đơn → chọn Phòng 101, kỳ 2026-10 → xem trước → phát hành. Thử tạo lại cùng kỳ để kiểm tra chống trùng. Có thể xác nhận thu một phần ở danh sách.</span></div></div><div class="guideStep"><div><strong>UC03 · Submit Maintenance Request (M12–M13)</strong><span>Chuyển vai trò Người thuê → Yêu cầu sửa chữa → Gửi yêu cầu → quay lại Chủ trọ để tiếp nhận và báo đã sửa → quay lại Người thuê để xác nhận hoàn tất.</span></div></div></div><div class="alertInfo">Lưu ý: Các use-case specification chính thức phải được nhóm Dũng và Quốc đối chiếu trước khi nộp. Phân quyền và OCR trong đây chỉ là mô phỏng. Không nhập dữ liệu nhạy cảm thật.</div><div class="formActions"><button class="btn btn-danger" type="button" data-action="reset-demo">Đặt lại dữ liệu mẫu</button></div>`)}
function actionOf(button){const a=button.dataset.action,id=button.dataset.id;if(a==='toggle-nav'){$('#sidebar').classList.toggle('open');$('#mobileOverlay').classList.toggle('open');$('#mobileToggle').setAttribute('aria-expanded',$('#sidebar').classList.contains('open')?'true':'false')}else if(a==='close-nav')closeNav();else if(a==='guide')guideModal();else if(a==='close-modal')closeModal();else if(a==='add-room'&&role==='landlord')roomModal();else if(a==='edit-room'&&role==='landlord')roomModal(id);else if(a==='room-detail'&&role==='landlord')roomDetail(id);else if(a==='room-filter'){roomFilter=button.dataset.filter;render()}else if(a==='invoice-filter'){invoiceFilter=button.dataset.filter;render()}else if(a==='issue-filter'){issueFilter=button.dataset.filter;render()}else if(a==='preview-invoice')updatePreview(true);else if(a==='invoice-detail')invoiceDetail(id);else if(a==='confirm-payment')paymentModal(id);else if(a==='add-reading'&&role==='landlord')meterModal();else if(a==='simulate-ocr'&&role==='landlord'){const f=$('#modalForm');f.elements.elecNew.value=Number(f.elements.elecOld.value)+85;f.elements.waterNew.value=Number(f.elements.waterOld.value)+5;f.dataset.source='ocr-demo';toast('Đã điền chỉ số MÔ PHỎNG. Vui lòng kiểm tra trước khi lưu.')}else if(a==='add-issue'&&role==='tenant')requestModal();else if(['issue-progress','issue-resolve','issue-close'].includes(a))advanceIssue(id,a);else if(a==='issue-detail')issueDetail(id);else if(a==='reset-demo'){if(confirm('Xóa mọi thay đổi đã lưu của UI demo và khôi phục dữ liệu ban đầu?')){data=seed();try{localStorage.removeItem(STORAGE)}catch(e){}role='landlord';page='dashboard';closeModal();render();toast('Đã khôi phục dữ liệu demo')}}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-page],[data-action]');if(!b)return;event.preventDefault();if(b.dataset.page){navigate(b.dataset.page);return}actionOf(b)});
document.addEventListener('submit',async event=>{const f=event.target;if(f.id==='invoiceForm'){event.preventDefault();if(role==='landlord')publishInvoice(f)}else if(f.id==='modalForm'){event.preventDefault();if(modalSubmit)try{await modalSubmit(f)}catch(err){errorIn(f,'Thao tác chưa hoàn thành. '+err.message)}}});
document.addEventListener('change',event=>{if(event.target.id==='roleSelect')switchRole(event.target.value);if(event.target.closest('#invoiceForm')){if(['roomId','month'].includes(event.target.name))prefillBill();else updatePreview(false)}});
document.addEventListener('input',event=>{if(event.target.id==='roomSearch'){roomQuery=event.target.value;const focused=event.target.selectionStart;render();const input=$('#roomSearch');input.focus();input.setSelectionRange(focused,focused)}if(event.target.closest('#invoiceForm'))updatePreview(false)});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal'))closeModal()});
$('#modal').addEventListener('close',()=>{modalSubmit=null});
render();
})();
</script>
</body>
</html>
